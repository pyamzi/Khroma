app = "opengallery"
primary_region = "ord" # Chicago: closest to Madison and to Neon aws-us-east-2

[deploy]
  release_command = "npm run migrate"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
